spring:
  application:
    name: devtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devtrack}
    username: ${DB_USERNAME:devtrack}
    password: ${DB_PASSWORD:devtrack}
  jpa:
    # R-08: no se resuelve fuera de la transaccion; evita LazyInitializationException.
    open-in-view: false
    hibernate:
      # R-11: Flyway gobierna el esquema. Hibernate solo valida y falla si hay deriva.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

devtrack:
  jwt:
    # Sin valor por defecto: si falta, la aplicacion NO arranca (fail-fast).
    # Ver ADR-0003 y el riesgo R-04.
    secret: ${DEVTRACK_JWT_SECRET:}
    issuer: ${DEVTRACK_JWT_ISSUER:devtrack}
    access-token-ttl: ${DEVTRACK_JWT_ACCESS_TOKEN_TTL:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
